<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan BA Sub 3:00 - Marathon Training Schedule</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg: #f5f1eb;
  --surface: #fff;
  --text: #1a1a1a;
  --text-light: #666;
  --text-lighter: #999;
  --border: #e0d7cc;
  --accent: #c84630;
  --accent-hover: #a63825;
  --green: #2d7a4a;
  --blue: #2b5f8a;
  --gold: #d4842e;
  --purple: #7b4ba3;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 40px 32px;
}

/* HEADER */
header {
  background: var(--surface);
  padding: 48px 32px 32px;
  margin: -40px -32px 40px;
  border-bottom: 3px solid var(--text);
}

.header-top {
  max-width: 1400px;
  margin: 0 auto;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-light);
  margin-bottom: 16px;
  font-weight: 500;
}

.title-main {
  max-width: 1400px;
  margin: 0 auto;
  font-family: 'Playfair Display', serif;
  font-size: 72px;
  font-weight: 400;
  line-height: 1;
  margin-bottom: 12px;
}

.title-main .sub {
  color: var(--accent);
  font-style: italic;
  font-weight: 600;
}

.subtitle {
  max-width: 1400px;
  margin: 0 auto;
  font-family: 'Playfair Display', serif;
  font-size: 18px;
  color: var(--text-light);
  font-style: italic;
  margin-bottom: 40px;
}

/* STATS */
.stats-grid {
  max-width: 1400px;
  margin: 0 auto 32px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
}

.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 20px;
  border-radius: 4px;
}

.stat-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-light);
  margin-bottom: 8px;
  font-weight: 600;
}

.stat-value {
  font-size: 48px;
  font-weight: 700;
  line-height: 1;
  font-family: 'Playfair Display', serif;
  margin-bottom: 4px;
}

.stat-value .unit {
  font-size: 18px;
  color: var(--text-light);
  font-weight: 400;
}

.stat-sub {
  font-size: 13px;
  color: var(--text-lighter);
}

.progress-bar {
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
  margin-top: 8px;
}

.progress-fill {
  height: 100%;
  background: var(--accent);
  transition: width 0.3s ease;
}

/* CONTROLS */
.controls {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.btn {
  padding: 10px 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 4px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  transition: all 0.2s;
  font-family: 'Inter', sans-serif;
}

.btn:hover {
  background: var(--text);
  color: var(--surface);
  border-color: var(--text);
}

.btn.primary {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

.btn.primary:hover {
  background: var(--accent-hover);
  border-color: var(--accent-hover);
}

.btn.danger {
  color: var(--accent);
}

/* WEEK NAV */
.week-nav {
  display: flex;
  gap: 8px;
  margin: 40px 0 32px;
  flex-wrap: wrap;
  padding-bottom: 32px;
  border-bottom: 1px solid var(--border);
}

.week-btn {
  padding: 10px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-light);
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  font-family: 'Inter', monospace;
  transition: all 0.2s;
  text-transform: lowercase;
}

.week-btn:hover {
  background: var(--text);
  color: var(--surface);
  border-color: var(--text);
}

.week-btn.active {
  background: var(--text);
  color: var(--surface);
  border-color: var(--text);
}

.week-btn.race {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

/* WEEK SECTION */
.week-section {
  margin-bottom: 64px;
}

.week-header {
  background: var(--text);
  color: var(--surface);
  padding: 16px 24px;
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.week-header-left {
  display: flex;
  align-items: baseline;
  gap: 16px;
}

.week-number {
  font-family: 'Playfair Display', serif;
  font-size: 32px;
  font-weight: 700;
}

.week-dates {
  font-size: 14px;
  opacity: 0.7;
}

.week-label {
  font-size: 13px;
  font-style: italic;
  font-family: 'Playfair Display', serif;
}

.week-km {
  font-size: 14px;
  font-weight: 600;
  margin-left: 16px;
}

/* SESSIONS */
.sessions {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.session {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 20px 24px;
  display: grid;
  grid-template-columns: 80px 1fr auto;
  gap: 24px;
  align-items: start;
  transition: all 0.2s;
}

.session:hover {
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.session.done {
  opacity: 0.6;
}

.session.type-race { 
  background: var(--accent);
  color: white;
}
.session.type-quality { 
  background: var(--gold);
  color: #1a1a1a;
}
.session.type-long { 
  background: var(--blue);
  color: white;
}
.session.type-z2 { 
  background: var(--green);
  color: white;
}
.session.type-gym { 
  background: #666;
  color: white;
}
.session.type-rest { 
  background: var(--border);
  color: var(--text);
}

.session.type-race .session-title,
.session.type-race .session-detail,
.session.type-race .metric-value,
.session.type-race .metric-label,
.session.type-race .session-meta,
.session.type-race .day-number,
.session.type-race .day-name {
  color: white;
}

.session.type-long .session-title,
.session.type-long .session-detail,
.session.type-long .metric-value,
.session.type-long .metric-label,
.session.type-long .session-meta,
.session.type-long .day-number,
.session.type-long .day-name {
  color: white;
}

.session.type-z2 .session-title,
.session.type-z2 .session-detail,
.session.type-z2 .metric-value,
.session.type-z2 .metric-label,
.session.type-z2 .session-meta,
.session.type-z2 .day-number,
.session.type-z2 .day-name {
  color: white;
}

.session.type-gym .session-title,
.session.type-gym .session-detail,
.session.type-gym .day-number,
.session.type-gym .day-name {
  color: white;
}

.session.type-quality .session-title,
.session.type-quality .session-detail,
.session.type-quality .metric-value,
.session.type-quality .metric-label,
.session.type-quality .session-meta,
.session.type-quality .day-number,
.session.type-quality .day-name {
  color: #1a1a1a;
}

.session.type-quality .session-detail strong {
  color: #000;
}

.session.type-race .metric-value.primary,
.session.type-long .metric-value.primary,
.session.type-z2 .metric-value.primary {
  color: #fff;
  font-weight: 800;
}

.session.type-quality .metric-value.primary {
  color: #8b4513;
  font-weight: 800;
}

.session-day {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.day-name {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-lighter);
  font-weight: 600;
}

.day-number {
  font-size: 32px;
  font-weight: 700;
  font-family: 'Playfair Display', serif;
  line-height: 1;
}

.session-content {
  flex: 1;
  min-width: 0;
}

.session-type {
  display: inline-block;
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 4px 10px;
  border-radius: 3px;
  font-weight: 700;
  margin-bottom: 8px;
}

.type-race { background: var(--accent); color: white; }
.type-quality { background: var(--gold); color: white; }
.type-long { background: var(--blue); color: white; }
.type-z2 { background: var(--green); color: white; }
.type-gym { background: var(--text-light); color: white; }
.type-rest { background: var(--border); color: var(--text-light); }

.session-title {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 6px;
  color: var(--text);
}

.session-detail {
  font-size: 14px;
  color: var(--text-light);
  line-height: 1.6;
  margin-bottom: 12px;
}

.session-detail strong {
  color: var(--text);
  font-weight: 600;
}

.session-metrics {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid rgba(255,255,255,0.2);
}

.session.type-quality .session-metrics {
  border-top-color: rgba(0,0,0,0.15);
}

.session.type-rest .session-metrics,
.session.type-gym .session-metrics {
  border-top-color: rgba(255,255,255,0.3);
}

.metric {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.metric-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-lighter);
  font-weight: 600;
}

.metric-value {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}

.metric-value.primary {
  color: var(--accent);
  font-weight: 700;
}

.session-shoe {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  background: rgba(255,255,255,0.2);
  border-radius: 3px;
  font-size: 11px;
  color: inherit;
  margin-top: 12px;
  font-weight: 500;
}

.session.type-quality .session-shoe {
  background: rgba(0,0,0,0.1);
  color: #1a1a1a;
}

.session-meta {
  display: flex;
  flex-direction: column;
  gap: 8px;
  font-size: 13px;
  color: var(--text-light);
  font-family: 'Inter', monospace;
}

.session-actions {
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: flex-end;
  min-width: 200px;
}

.data-inputs {
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 100%;
}

.data-inputs input,
.data-inputs textarea {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 12px;
  border-radius: 3px;
  font-size: 12px;
  font-family: 'Inter', sans-serif;
  width: 100%;
}

.data-inputs input:focus,
.data-inputs textarea:focus {
  outline: none;
  border-color: var(--accent);
}

.data-inputs textarea {
  resize: vertical;
  min-height: 60px;
}

.checkbox {
  width: 28px;
  height: 28px;
  border: 2px solid var(--border);
  border-radius: 4px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
}

.checkbox:hover {
  border-color: var(--accent);
}

.checkbox.checked {
  background: var(--green);
  border-color: var(--green);
}

.checkbox.checked::after {
  content: '✓';
  color: white;
  font-weight: 700;
  font-size: 16px;
}

.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--text);
  color: var(--surface);
  padding: 16px 24px;
  border-radius: 4px;
  font-size: 14px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  animation: slideIn 0.3s ease;
  z-index: 1000;
}

@keyframes slideIn {
  from {
    transform: translateY(100%);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

@media (max-width: 768px) {
  .title-main {
    font-size: 48px;
  }
  
  .session {
    grid-template-columns: 60px 1fr;
  }
  
  .session-actions {
    grid-column: 1 / -1;
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
    min-width: 0;
    width: 100%;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  
  .data-inputs {
    flex: 1;
  }
  
  .session-metrics {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

      {type:'rest',title:'Caminata 15\' + 3 strides',detail:'Activación muy suave.',km:0,dur:15},
      {type:'rest',title:'Descanso total',detail:'Preparación mental y física.',km:0,dur:0},
      {type:'race',title:'🏁 MARATÓN BUENOS AIRES',detail:'<strong>CARRERA OBJETIVO: Maratón de Buenos Aires</strong><br><br><strong>META: Sub 3:00:00 (2:59:59 o mejor)</strong><br><br><strong>Estrategia de carrera:</strong><br>• <strong>Km 1-5:</strong> 4:20-4:22/km (asentar ritmo, NO salir rápido)<br>• <strong>Km 5-21:</strong> 4:15/km (MP objetivo, zona de confort)<br>• <strong>Km 21-30:</strong> 4:15/km (mantener, vigilar FC y sensación)<br>• <strong>Km 30-35:</strong> 4:15/km (concentración máxima, punto crítico)<br>• <strong>Km 35-42:</strong> 4:10-4:12/km si hay energía, sino mantener 4:15<br><br><strong>Nutrición:</strong><br>• Gel 1: km 8 | Gel 2: km 14 | Gel 3: km 20 | Gel 4: km 26 | Gel 5: km 32 | Gel 6: km 37<br>• Hidratación cada 5 km (~150ml)<br><br><strong>Criterios de decisión km 30:</strong><br>• Si FC <172 y piernas frescas → empujar 4:10-4:12<br>• Si FC ~174 y piernas respondiendo → mantener 4:15<br>• Si FC >176 o piernas pesadas → ajustar a 4:18-4:20<br><br><strong>Splits objetivo para sub-3:</strong><br>• 5K: 21:15 | 10K: 42:30 | 15K: 1:03:45 | 21K: 1:29:45<br>• 25K: 1:46:45 | 30K: 2:08:00 | 35K: 2:29:00 | 40K: 2:50:00<br>• Finish: 2:59:30 (margen 30s)',km:42.195,pace:'MP 4:15',dur:180,metrics:{primary:'Tiempo: 2:59:59',secondary:'Ritmo MP 4:15/km'},shoe:'Cielo X1 3.0'}
    ]
  }
];

let progress = {};
let currentWeek = 1;

// Storage
async function loadProgress() {
  try {
    const result = await window.storage.get('plan-progress-final');
    if (result) progress = JSON.parse(result.value);
  } catch (e) {
    progress = {};
  }
}

async function saveProgress() {
  try {
    await window.storage.set('plan-progress-final', JSON.stringify(progress));
  } catch (e) {
    console.error('Save error:', e);
  }
}

// Utils
function todayWeek() {
  const now = Date.now();
  const diff = now - START_DATE;
  const week = Math.floor(diff / (7 * MS_PER_DAY)) + 1;
  return Math.max(1, Math.min(19, week));
}

function daysUntil(target) {
  const now = Date.now();
  const diff = target - now;
  return Math.ceil(diff / MS_PER_DAY);
}

function getSessionKey(week, idx) {
  return `${week}-${idx}`;
}

function calcStats() {
  let totalKm = 0, doneKm = 0, totalSess = 0, doneSess = 0;
  PLAN.forEach(w => {
    w.sessions.forEach((s, idx) => {
      if (s.km > 0) {
        totalKm += s.km;
        totalSess++;
        const key = getSessionKey(w.week, idx);
        if (progress[key]?.done) {
          doneKm += s.km;
          doneSess++;
        }
      }
    });
  });
  return { totalKm, doneKm, totalSess, doneSess };
}

// Render
function render() {
  const stats = calcStats();
  const daysToRace = daysUntil(RACE_DATE);
  const daysToTuneup = daysUntil(TUNEUP_DATE);
  
  document.getElementById('days-to-race').textContent = daysToRace;
  document.getElementById('current-week').textContent = currentWeek;
  document.getElementById('km-done').textContent = Math.round(stats.doneKm);
  document.getElementById('km-total').textContent = Math.round(stats.totalKm);
  document.getElementById('km-progress').style.width = (stats.doneKm / stats.totalKm * 100) + '%';
  document.getElementById('sessions-done').textContent = stats.doneSess;
  document.getElementById('sessions-total').textContent = stats.totalSess;
  document.getElementById('sessions-progress').style.width = (stats.doneSess / stats.totalSess * 100) + '%';
  document.getElementById('days-to-tuneup').textContent = daysToTuneup > 0 ? daysToTuneup + 'd' : '✓';
  
  const container = document.getElementById('weeks-container');
  container.innerHTML = '';
  
  PLAN.forEach(week => {
    const weekDiv = document.createElement('div');
    weekDiv.className = 'week-section';
    weekDiv.id = `week-${week.week}`;
    
    const header = `
      <div class="week-header">
        <div class="week-header-left">
          <div class="week-number">Semana ${week.week}</div>
          <div class="week-dates">${week.start} — ${week.end}</div>
        </div>
        <div class="week-label">${week.block}<span class="week-km">${week.kmTarget} km esta semana</span></div>
      </div>
    `;
    
    const sessionsHTML = week.sessions.map((s, idx) => {
      const key = getSessionKey(week.week, idx);
      const data = progress[key] || {};
      const isDone = data.done || false;
      
      const startDate = new Date(START_DATE + (week.week - 1) * 7 * MS_PER_DAY + idx * MS_PER_DAY);
      const dayName = ['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'][startDate.getDay()];
      const dayNum = startDate.getDate();
      
      let metricsHTML = '';
      if (s.metrics) {
        metricsHTML = `
          <div class="session-metrics">
            <div class="metric">
              <div class="metric-label">📍 Objetivo principal</div>
              <div class="metric-value primary">${s.metrics.primary}</div>
            </div>
            <div class="metric">
              <div class="metric-label">📊 Referencia secundaria</div>
              <div class="metric-value">${s.metrics.secondary}</div>
            </div>
          </div>
        `;
      }
      
      let shoeHTML = '';
      if (s.shoe) {
        shoeHTML = `<div class="session-shoe">👟 ${s.shoe}</div>`;
      }
      
      return `
        <div class="session ${isDone ? 'done' : ''} type-${s.type}" data-key="${key}">
          <div class="session-day">
            <div class="day-name">${dayName}</div>
            <div class="day-number">${dayNum}</div>
          </div>
          <div class="session-content">
            <span class="session-type type-${s.type}">${s.type}</span>
            <div class="session-title">${s.title}</div>
            <div class="session-detail">${s.detail}</div>
            ${metricsHTML}
            ${shoeHTML}
            ${s.km > 0 ? `
              <div class="session-meta">
                <div>${s.km} km · ${s.pace || ''} · ${s.dur || ''} min</div>
              </div>
            ` : ''}
          </div>
          <div class="session-actions">
            ${s.km > 0 ? `
              <div class="data-inputs">
                <input type="text" placeholder="Ritmo real (ej: 4:15)" value="${data.pace || ''}" data-field="pace">
                <input type="text" placeholder="FC media (ej: 165)" value="${data.hr || ''}" data-field="hr">
                <input type="number" min="1" max="5" placeholder="Sensación 1-5" value="${data.feel || ''}" data-field="feel">
                <textarea placeholder="Notas" data-field="notes">${data.notes || ''}</textarea>
              </div>
              <div class="checkbox ${isDone ? 'checked' : ''}" data-action="toggle"></div>
            ` : ''}
          </div>
        </div>
      `;
    }).join('');
    
    weekDiv.innerHTML = header + `<div class="sessions">${sessionsHTML}</div>`;
    container.appendChild(weekDiv);
  });
  
  attachListeners();
}

function attachListeners() {
  document.querySelectorAll('.session').forEach(session => {
    const key = session.dataset.key;
    
    const checkbox = session.querySelector('[data-action="toggle"]');
    if (checkbox) {
      checkbox.onclick = async () => {
        if (!progress[key]) progress[key] = {};
        progress[key].done = !progress[key].done;
        await saveProgress();
        render();
        showToast(progress[key].done ? 'Completada ✓' : 'Desmarcada');
      };
    }
    
    session.querySelectorAll('[data-field]').forEach(input => {
      input.onchange = async () => {
        if (!progress[key]) progress[key] = {};
        progress[key][input.dataset.field] = input.value;
        await saveProgress();
      };
    });
  });
}

function createWeekNav() {
  const nav = document.getElementById('week-nav');
  nav.innerHTML = '';
  
  PLAN.forEach(w => {
    const btn = document.createElement('button');
    btn.className = 'week-btn';
    if (w.week === 19) btn.classList.add('race');
    if (w.week === currentWeek) btn.classList.add('active');
    btn.textContent = `s${String(w.week).padStart(2, '0')}`;
    btn.onclick = () => {
      document.getElementById(`week-${w.week}`).scrollIntoView({ behavior: 'smooth', block: 'start' });
      document.querySelectorAll('.week-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    };
    nav.appendChild(btn);
  });
}

// Actions
document.getElementById('btn-today').onclick = () => {
  document.getElementById(`week-${currentWeek}`).scrollIntoView({ behavior: 'smooth' });
};

document.getElementById('btn-export').onclick = () => {
  let csv = 'Semana,Día,Tipo,Sesión,km,Pace,Pace real,FC,Sensación,Notas,Hecho\n';
  PLAN.forEach(w => {
    w.sessions.forEach((s, idx) => {
      const key = getSessionKey(w.week, idx);
      const data = progress[key] || {};
      const date = new Date(START_DATE + (w.week - 1) * 7 * MS_PER_DAY + idx * MS_PER_DAY);
      const dayName = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'][date.getDay()];
      csv += `${w.week},${dayName},${s.type},"${s.title}",${s.km},"${s.pace || ''}","${data.pace || ''}","${data.hr || ''}","${data.feel || ''}","${(data.notes || '').replace(/"/g, '""')}",${data.done ? 'Sí' : 'No'}\n`;
    });
  });
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `plan-ba-sub3-${new Date().toISOString().split('T')[0]}.csv`;
  a.click();
  showToast('Exportado');
};

document.getElementById('btn-reset').onclick = async () => {
  if (confirm('¿Resetear todo el progreso?')) {
    progress = {};
    await saveProgress();
    render();
    showToast('Reseteado');
  }
};

function showToast(msg) {
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2500);
}

// Boot
(async () => {
  await loadProgress();
  currentWeek = todayWeek();
  createWeekNav();
  render();
})();
</script>
</body>
</html>
